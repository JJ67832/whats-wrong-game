[build]
  command = "npm run build:web"
  publish = "web-build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--production=false"
  CI = "true"
  EXPO_NO_TELEMETRY = "1"

# Wichtig für Single Page Apps (SPA) - React Navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Optimierungen
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"