[build]
  command = "npm run build:web"
  publish = "web-build"

[build.environment]
  NODE_VERSION = "18"

# Wichtig für Single Page Apps (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Optimierungen
[[headers]]
  for = "/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"